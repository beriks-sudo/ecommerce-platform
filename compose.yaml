services:
  traefik:
    image: traefik:${TRAEFIK_VERSION:-v3.6.14}
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./docker/traefik/certs:/etc/traefik/certs:ro
    networks:
      - frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.ecommerce.localho.st`)"
      - "traefik.http.routers.traefik.entrypoints=web"
      - "traefik.http.routers.traefik.service=api@internal"


  app:
    networks: [frontend, backend]
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    depends_on:
      - mysql
      - redis

  web:
    networks: [frontend]
    image: nginx:1.27-alpine
    depends_on:
      - app
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=ecommerce-platform_frontend"
      # storefront
      - "traefik.http.routers.storefront.rule=Host(`ecommerce.localho.st`)"
      - "traefik.http.routers.storefront.entrypoints=websecure"
      - "traefik.http.routers.storefront.tls=true"
      - "traefik.http.routers.storefront.service=web"
      # admin
      - "traefik.http.routers.admin.rule=Host(`admin.ecommerce.localho.st`)"
      - "traefik.http.routers.admin.entrypoints=websecure"
      - "traefik.http.routers.admin.tls=true"
      - "traefik.http.routers.admin.service=web"
      # api
      - "traefik.http.routers.api.rule=Host(`api.ecommerce.localho.st`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.service=web"
      - "traefik.http.services.web.loadbalancer.server.port=80"

  mysql:
    networks: [backend]
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ecommerce}
      MYSQL_USER: ${DB_USERNAME:-ecommerce}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ecommerce_password}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-ecommerce_password}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    networks: [backend]
    image: redis:7.4-alpine

networks:
  frontend:
  backend:

volumes:
  mysql_data:


