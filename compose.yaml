
  services:
    app:
      build:
        context: .
        dockerfile: docker/php/Dockerfile
      working_dir: /var/www/html
      depends_on:
        - mysql
        - redis

    web:
      image: nginx:1.27-alpine
      ports:
        - "${APP_PORT:-8080}:80"
      depends_on:
        - app

    mysql:
      image: mysql:8.4
      environment:
        MYSQL_DATABASE: ${DB_DATABASE:-ecommerce}
        MYSQL_USER: ${DB_USERNAME:-ecommerce}
        MYSQL_PASSWORD: ${DB_PASSWORD:-ecommerce_password}
        MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-ecommerce_password}
      volumes:
        - mysql_data:/var/lib/mysql

    redis:
      image: redis:7.4-alpine
  
  volumes:
    mysql_data: