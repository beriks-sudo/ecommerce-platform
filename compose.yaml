services:
  app:
    networks: [frontend, backend]
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
      - redis

  web:
    networks: [frontend]
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - app

  mysql:
    networks: [backend]
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ecommerce}
      MYSQL_USER: ${DB_USERNAME:-ecommerce}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ecommerce_password}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-ecommerce_password}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    networks: [backend]
    image: redis:7.4-alpine

networks:
  frontend:
  backend:

volumes:
  mysql_data:
