; Local-only конфигурация Xdebug 3. НЕ production default.
; Активируется только в local-окружении после установки расширения Xdebug
; в образе (см. docs/xdebug-workflow.md). В production не включается.

xdebug.mode=debug
xdebug.start_with_request=trigger
xdebug.client_host=host.docker.internal
xdebug.client_port=9003
